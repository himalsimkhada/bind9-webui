// BIND9 Web UI — named.conf for the dockerized BIND9 server.
// Remote rndc control channel (TCP 953) so the web-UI container can manage it.

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
include "/etc/bind/named.conf.default-zones";

// Shared rndc key — must match /etc/bind/rndc.key mounted in both containers.
include "/etc/bind/rndc.key";

// Allow remote control from the web-UI container (and the Docker network).
controls {
    inet 0.0.0.0 port 953 allow { any; } keys { rndc-key; };
};
