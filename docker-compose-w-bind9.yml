# BIND9 Web UI — full stack: BIND9 name server + API backend container.
#
# Usage:
#   docker compose -f docker-compose-w-bind9.yml up -d
# The API is then available at http://localhost:5000; the UI lives in the
# webui facade (himalsimkhada/webui).
#
# The web-UI container manages the BIND9 container over the rndc control
# channel (TCP 953) and shares /etc/bind via host-mounted files + named
# volumes for zone data and logs.
#
# If you instead run BIND on the host (bare-metal), use the web-UI-only
# docker-compose.yml (see the README).

services:
  bind9:
    image: internetsystemsconsortium/bind9:9.18
    container_name: bind9
    restart: unless-stopped
    ports:
      # DNS + rndc are published on non-default host ports (5353 / 9353) so
      # nothing on the host collides with them (systemd-resolved already holds
      # 53, and 953 is the classic rndc port). To serve DNS on the standard
      # port 53 instead, map "53:53/udp" and "53:53/tcp" here.
      - "5353:53/udp"
      - "5353:53/tcp"
      - "9353:953"              # rndc control channel for the web-UI container
    volumes:
      - ./docker/bind/named.conf:/etc/bind/named.conf:rw
      - ./docker/bind/named.conf.options:/etc/bind/named.conf.options:rw
      - ./docker/bind/named.conf.local:/etc/bind/named.conf.local:rw
      - ./docker/bind/named.conf.default-zones:/etc/bind/named.conf.default-zones:rw
      - ./docker/bind/rndc.key:/etc/bind/rndc.key:ro
      - ./docker/bind/root.hints:/etc/bind/root.hints:ro
      - ./docker/bind/db.local:/etc/bind/db.local:ro
      - ./docker/bind/db.127:/etc/bind/db.127:ro
      - ./docker/bind/db.0:/etc/bind/db.0:ro
      - ./docker/bind/db.255:/etc/bind/db.255:ro
      - bind-zones:/etc/bind/zones       # writable area for zone files (db.<zone>)
      - bind-logs:/var/log/bind          # named.log read by the web UI
    # command: ["-4"]

  webui:
    image: ghcr.io/himalsimkhada/webui/bind9-webui:latest
    # build: .   # optional: build the image from this repo instead of pulling
    container_name: bind9-webui
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/session"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "5000:5000"
    depends_on:
      - bind9
    environment:
      RNDC_HOST: bind9          # talk to the BIND container over TCP
      RNDC_PORT: "953"
      RNDC_KEY: /etc/bind/rndc.key
      BIND_CONF_DIR: /etc/bind
      LOG_FILE: /var/log/bind/named.log
      ZONE_DIR: /etc/bind/zones
      ZONE_OWNER: "bind:bind"   # named runs as 'bind'; make zone files writable
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - ./docker/bind/named.conf:/etc/bind/named.conf:rw
      - ./docker/bind/named.conf.options:/etc/bind/named.conf.options:rw
      - ./docker/bind/named.conf.local:/etc/bind/named.conf.local:rw
      - ./docker/bind/named.conf.default-zones:/etc/bind/named.conf.default-zones:rw
      - ./docker/bind/rndc.key:/etc/bind/rndc.key:ro
      - bind-zones:/etc/bind/zones
      - bind-logs:/var/log/bind

volumes:
  bind-zones:
  bind-logs:
